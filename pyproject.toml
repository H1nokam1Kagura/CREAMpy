[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creampy"
version = "1.0.0"
description = "Bass diffusion, network-effects platform, and DREAM closed-economy welfare models — Python pipeline for agricultural research impact evaluation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

authors = [
    { name = "Neil Hausmann" },
]

keywords = [
    "agricultural economics",
    "bass diffusion",
    "adoption model",
    "economic surplus",
    "welfare analysis",
    "research evaluation",
    "DREAM",
    "IFPRI",
    "crop research",
    "impact assessment",
    "partial equilibrium",
    "producer surplus",
    "consumer surplus",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev  = ["pytest>=7"]
eval = ["openpyxl>=3.1"]   # DREAMpy cross-validation harness only

[project.scripts]
creampy = "creampy.__main__:main"

[project.urls]
Homepage      = "https://github.com/H1nokam1Kagura/CREAMpy"
Documentation = "https://github.com/H1nokam1Kagura/CREAMpy#readme"
Source        = "https://github.com/H1nokam1Kagura/CREAMpy"
"Bug Tracker" = "https://github.com/H1nokam1Kagura/CREAMpy/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
